name: PHP Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 是最低可用的实测版本，8.4 用来提前发现新弃用
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, dom, json, openssl
          coverage: none

      - name: 语法检查
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: 检查 BOM 与 CRLF
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            if [ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error file=$file::文件带 UTF-8 BOM，会导致 headers already sent"
              fail=1
            fi
          done < <(find . -name '*.php' -print0)
          exit $fail

  guard:
    name: 入口文件与版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 主文件存在且目录名正确
        run: |
          test -f sucaizy-ai-writer.php || { echo "::error::缺少主文件 sucaizy-ai-writer.php"; exit 1; }
          grep -q "Plugin Name:" sucaizy-ai-writer.php || { echo "::error::主文件缺少 Plugin Name 头"; exit 1; }

      - name: 版本号一致
        run: |
          header=$(grep -m1 '^ \* Version:' sucaizy-ai-writer.php | sed 's/.*Version:[[:space:]]*//')
          const=$(grep -m1 "define('SAW_VERSION'" sucaizy-ai-writer.php | sed "s/.*SAW_VERSION',[[:space:]]*'//; s/'.*//")
          stable=$(grep -m1 '^Stable tag:' readme.txt | sed 's/Stable tag:[[:space:]]*//')
          echo "header=$header const=$const stable=$stable"
          [ "$header" = "$const" ] || { echo "::error::头部 Version 与 SAW_VERSION 不一致"; exit 1; }
          [ "$header" = "$stable" ] || { echo "::error::头部 Version 与 readme.txt Stable tag 不一致"; exit 1; }
