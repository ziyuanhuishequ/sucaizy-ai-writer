name: 功能建议
description: 想要新的输入类型、写作参数或界面改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 先说清楚卡在哪一步，而不是直接给方案
      placeholder: 我要写 20 篇同类素材的文章，每次都要手动改栏目顺序……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望的解决方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过这个问题
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 涉及模型提示词改动
        - label: 涉及抓取逻辑改动
        - label: 涉及数据库结构改动（升级时要写迁移）
        - label: 仅界面调整
